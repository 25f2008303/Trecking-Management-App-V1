<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
    	<meta name="viewport" content="width=device-width, initial-scale=1.0">
    	<title>Trekking Management Application</title>

    	<style>
        body{font-family: "Century Gothic",CenturyGothic,AppleGothic,sans-serif;background:#f6f7f9;color:#1f2937;margin: 0;}

        .topbar
	{
            	background:white;
            	border-bottom:1px solid #e5e7eb;
            	padding:16px 24px;
            	display:flex;
            	justify-content:space-between;
            	align-items:center;
            	flex-wrap:wrap;
	}

	.topbar h1
	{
		margin:0;
            	font-size:24px;
	}

        .nav-links
	{
		display:flex;
            	gap:14px;
            	align-items:center;
            	flex-wrap:wrap;
        }

        .nav-links a 
	{		
		text-decoration:none;
            	color:#1f2938;
            	font-weight:600;
        }

        .nav-links a:hover
	{
            color:#1f6f78;
	}
	

       .logout-btn
	{
         	background:#ea2828;
            	color:white !important;
           	padding: 8px 14px;
            	border-radius: 8px;
	}

        .logout-btn:hover
	{
		background:#bd2222;
        }

        .container
	{
            	max-width:1100px;
            	margin-top:30px;
		margin-bottom:30px;
		margin-left:auto;
		margin-right:auto;
            	padding:20px;
	}

        h2,h3,h4
	{
		margin-bottom:12px;
	}

        .card
	{
            	background:white;
            	border:1px solid #e5e7eb;
            	border-radius:12px;
            	padding:18px;
            	margin-bottom:20px;
	}

        .layout
	{
            	display:grid;
            	grid-template-columns:repeat(4, 1fr);
            	gap:16px;
            	margin:20px 0;
        }

        .layout2
	{
            	margin-top:20px;
	}

        .fg
	{
            	display:grid;
            	grid-template-columns:repeat(2, 1fr);
            	gap:12px;
	}

        input,select,button
	{
            	padding:10px 12px;
            	border:1px solid #d1d5db;
            	border-radius:8px;
            	font-size:14px;
	}

        button
	{
            	background:#1f6f78;
            	color:white;
            	border:none;
            	cursor:pointer;
	}

        button:hover
	{
            	background:#185961;
        }

        table
	{
            	width:100%;
            	border-collapse:collapse;
            	margin-top:12px;
        }

        th, td
	{
            	padding:10px;
            	border-bottom:1px solid #e5e7eb;
            	text-align:left;
        }

        th
	{
            	background:#f9fafb;
        }

       	.action-link
	{
    		text-decoration:none;
    		color:white;
    		padding: 6px 10px;
    		border-radius: 8px;
    		display:inline-block;
    		margin-right: 6px;
    		font-size:13px;
	}

	.edit-link
 	{
    	background:#2563eb;
	}

	.edit-link:hover
	{
    		background:#1d4ed8;
	}

	.delete-link
	{
    		background:#dc2626;
	}

	.delete-link:hover
	{
    		background:#b91c1c;
	}
    </style>
</head>

<body>

    <div class="topbar">
        <h1>Trekking Management Application</h1>

        <div class="nav-links">
            <a href="{{url_for('home')}}">HOME</a>

            {% if session.get("user_id") %}
                <a href="{{url_for('logout')}}" class="logout-btn">LOGOUT</a>
            {% endif %}
        </div>
    </div>

    <div>
        {% block content %}
        {% endblock %}
    </div>

</body>
</html>
