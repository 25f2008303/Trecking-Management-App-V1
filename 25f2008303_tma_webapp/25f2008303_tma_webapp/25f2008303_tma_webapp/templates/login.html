{% extends "base.html" %}
{% block content %}


<div class="container" style="text-align:center;">
	{% if error %}
      		<p style="color:red;">{{error}}</p>
	{% endif %}

	<div style="text-align:center;"><h1>LOGIN TO YOUR ACCOUNT</h1>
	<br>
	
	<div class="card">
	<form method="post" action="{{url_for('login')}}">

	<label>EMAIL:</label>
	<input type="email" name="email" required>
	<br>
	<br>

	<label>PASSWORD:</label>
	<input type="password" name="password" required>
	<br>
	<br>

	<button type="submit" style="font-size:16px;">Login</button>	
	</form>
	</div>
	<br>
	<br>
	<br>

	<div style="text-align:center;">
		New User? Click to register as User of Staff at this link: 
	<a class="action-link edit-link" href="{{url_for('register')}}">Register</a>
	</div>
</div>

{% endblock %}
